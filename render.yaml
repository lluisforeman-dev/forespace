services:
  - type: web
    name: eigengraph-web
    runtime: python
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python manage.py migrate --settings=config.settings.prod && python manage.py seed_predicates --overwrite --settings=config.settings.prod && python manage.py seed_attributes --settings=config.settings.prod && gunicorn config.wsgi:application --workers 3 --timeout 60
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard (from Neon)
      - key: REDIS_URL
        fromService:
          name: eigengraph-redis
          type: redis
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: openai/gpt-5.6-luna
      - key: AI_MODEL_PROSE
        value: openai/gpt-5.6-luna
      - key: AI_MODEL_EIGENSEARCH
        value: openai/gpt-5.6-luna:online
      - key: AI_MODEL_FAST
        value: openai/gpt-4o-mini
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_SERVER
        value: smtp.hostinger.com
      - key: MAIL_PORT
        value: 465
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: BASE_URL
        sync: false          # set to your Render URL once deployed

  - type: worker
    name: eigengraph-worker
    runtime: python
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: celery -A config worker -Q crawl,parse,triage,extract,resolve,adjudicate,project,analytics,analysis --loglevel=info --concurrency 2 --without-mingle --without-gossip
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        fromService:
          name: eigengraph-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: eigengraph-redis
          type: redis
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: openai/gpt-5.6-luna
      - key: AI_MODEL_PROSE
        value: openai/gpt-5.6-luna
      - key: AI_MODEL_EIGENSEARCH
        value: openai/gpt-5.6-luna:online
      - key: AI_MODEL_FAST
        value: openai/gpt-4o-mini

  - type: cron
    name: eigengraph-scheduler
    runtime: python
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    schedule: "0 6 * * *"    # 06:00 UTC daily
    startCommand: python manage.py run_scheduled_sources --settings=config.settings.prod
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        fromService:
          name: eigengraph-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: eigengraph-redis
          type: redis
          property: connectionString

  - type: cron
    name: eigengraph-analytics
    runtime: python
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    schedule: "0 */6 * * *"  # every 6 hours
    startCommand: python manage.py warm_analytics_cache --settings=config.settings.prod
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        fromService:
          name: eigengraph-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: eigengraph-redis
          type: redis
          property: connectionString

  - type: cron
    name: eigengraph-freshness
    runtime: python
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    schedule: "0 5 * * *"    # 05:00 UTC daily, before the feed scheduler
    startCommand: python manage.py refresh_stale_facts --apply --limit 25 --settings=config.settings.prod
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        fromService:
          name: eigengraph-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: eigengraph-redis
          type: redis
          property: connectionString

  - type: cron
    name: eigengraph-identity
    runtime: python
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    schedule: "0 4 * * 0"    # Sundays 04:00 UTC — anchor new entities to Wikidata/domains,
    # then heal resolution debris (LLM arbitration runs here: the API key lives on Render)
    startCommand: python manage.py anchor_identifiers --limit 300 --settings=config.settings.prod && python manage.py heal_entity_fragments --apply --limit 20 --settings=config.settings.prod
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        fromService:
          name: eigengraph-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: eigengraph-redis
          type: redis
          property: connectionString

  - type: redis
    name: eigengraph-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
