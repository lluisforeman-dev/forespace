{% extends "base.html" %}
{% block title %}Map — ForeSpace{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
  <h1 style="font-size:18px;font-weight:700;color:#1a1a2e">Space Industry Map</h1>
  <span id="mapCount" style="font-size:13px;color:#888"></span>
</div>

<div class="card" style="padding:0;overflow:hidden">
  <div id="map" style="height:600px;width:100%"></div>
</div>

<div style="margin-top:10px;font-size:12px;color:#aaa">
  Showing headquarters and office locations. Run <strong>Fill missing locations</strong> from the dashboard to improve coverage.
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TYPE_COLORS = {
  company: '#1a1a2e', investor: '#6f42c1', entity: '#0066cc',
  university: '#28a745', facility: '#fd7e14', program: '#dc3545',
  funding_program: '#20c997', end_user: '#6c757d', person: '#e83e8c',
};

const map = L.map('map').setView([30, 10], 2);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © Esri', maxZoom: 16,
}).addTo(map);

fetch("{% url 'curation:map_data' %}")
  .then(r => r.json())
  .then(data => {
    let placed = 0, skipped = 0;
    const jitter = () => (Math.random() - 0.5) * 0.018; // ±0.009° ≈ ±1km
    data.markers.forEach(m => {
      if (m.lat == null || m.lon == null) { skipped++; return; }
      const color = TYPE_COLORS[m.type] || '#888';
      const lat = m.has_address ? m.lat : m.lat + jitter();
      const lon = m.has_address ? m.lon : m.lon + jitter();
      const marker = L.circleMarker([lat, lon], {
        radius: 6, fillColor: color, color: '#fff',
        weight: 1.5, opacity: 1, fillOpacity: 0.85,
      });
      const officeLabel = m.office_type ? ` <span style="color:#888;font-size:11px">(${m.office_type})</span>` : '';
      marker.bindPopup(
        `<a href="/curation/entity/${m.id}/" style="font-weight:600;font-size:13px">${m.name}</a>${officeLabel}` +
        `<br><span style="font-size:11px;color:#888">${m.type} · ${m.place || ''}</span>`
      );
      marker.addTo(map);
      placed++;
    });
    document.getElementById('mapCount').textContent =
      skipped > 0 ? `${placed} plotted · ${skipped} awaiting geocoding` : `${placed} locations plotted`;
  });
</script>
{% endblock %}
